<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;800;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,"Zen Kaku Gothic New",sans-serif;background:#111}
.c{position:relative;width:1200px;height:630px;overflow:hidden}
.g{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.g img{width:100%;height:100%;object-fit:cover;display:block}
.c:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 28%,rgba(0,0,0,.82))}
.t{position:absolute;inset:auto 0 0 0;z-index:2;padding:0 64px 54px;color:#fff}
.k{font-size:22px;font-weight:600;letter-spacing:.14em;color:#9ee3b8;margin-bottom:16px}
h1{font-size:70px;font-weight:800;line-height:1.14;letter-spacing:-.025em;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.s{margin-top:18px;font-size:25px;font-weight:600;letter-spacing:.1em;color:#e6e0d4}
</style>
<div class="c"><div class="g" id="g"></div>
 <div class="t"><div class="k">FRI, OCT 23 · 10:00</div>
 <h1>Ave Mujica を観て、<br>そのままランチ。</h1>
 <div class="s">SHINAGAWA · KAWASAKI · YOKOHAMA</div></div></div>
<script>
fetch('photos.json').then(r=>r.json()).then(p=>{
  ['cinema_shinagawa','citta_plaza','skybldg'].forEach(k=>{
    var i=document.createElement('img'); i.src=p[k].thumb; document.getElementById('g').appendChild(i);
  });
});
</script>
